name: CI

# 触发条件：推 master 与所有 PR 都跑。
# 门禁的真相在 init.sh 里，这个工作流只做一件事：在干净的 Linux 机器上把它跑一遍。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 门禁：本地那十件事，在 ubuntu 上原样跑一遍。
  # 为什么用 bootstrap.sh 而不是手写安装步骤：本地和 CI 必须走同一条装环境的路，
  # 否则「本地绿、CI 红」只能靠猜。
  gate:
    name: 门禁
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装环境（建 venv、装后端依赖、npm ci）
        run: bash scripts/bootstrap.sh

      - name: 跑门禁
        run: bash ./init.sh

  # 生产构建：前端生产包与两个镜像，必须有一台机器能真的把它们造出来。
  # 此前它们只被 docs/OPERATIONS.md 描述过，从没在 CI 上跑过一次——
  # 「镜像是怎么来的」这句话当时没有证据，只能靠人肉相信。
  build:
    name: 生产构建
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端生产构建
        working-directory: frontend
        run: npm ci && npm run build

      - name: 编排文件自检
        run: docker compose config -q

      - name: 种下载产物探针
        # 这一步是为了让下一条检查**真能变红**。
        # 干净检出里 backend/downloads 压根不存在，构建上下文里没有它——
        # 那时 `downloads/` 这条 .dockerignore 规则写没写、删了还是没删，
        # 检查都判绿。一条永远关不住任何东西的检查是假守卫。
        # 所以构建之前先往构建上下文里种一个探针：谁把规则删了，
        # 探针就会进镜像，检查立刻转红。
        #
        # 探针不进仓库：backend/downloads 已被 .gitignore 忽略。
        run: |
          set -euo pipefail
          mkdir -p backend/downloads
          echo ci-download-probe > backend/downloads/ci-probe.txt
          if [ -n "$(git status --porcelain backend/downloads)" ]; then
            echo "backend/downloads 没有被 git 忽略，探针会污染工作树："
            git status --porcelain backend/downloads
            exit 1
          fi

      - name: 镜像构建
        run: docker compose build

      - name: 镜像里查不到下载残留
        # 下载产物用完即删，留在盘上的多半是半截文件。构建上下文带着它，
        # 等于把上一台机器的残留发给下一台机器。
        #
        # 两条判据：探针不许出现在镜像里的任何位置（这是「规则被删了」
        # 的真信号）；/app/downloads 目录本身也不该有内容。目录不存在是
        # 正常的（排除之后它压根不会被建出来）——查不到 ≠ 有残留。
        #
        # 用 compose 推导出的镜像名（`config --images` 打印的就是构建时
        # 打上的那个 tag）去查，但**不**用 compose run 进去——那会把 bind
        # mount 的宿主目录按 root 属主建出来，后面的冒烟步骤就 chmod
        # 不动了。
        #
        # 为什么不用 `docker compose images -q backend`：那条命令列的是
        # **容器**用的镜像，这时还没有容器，输出是空的（实测）。
        run: |
          set -euo pipefail
          image=$(docker compose config --images | grep -E -- '-backend$' | head -n 1)
          if [ -z "$image" ]; then
            echo "找不到后端镜像，镜像检查无从谈起"
            exit 1
          fi
          probe=$(docker run --rm --entrypoint sh "$image" -c \
            "find /app -name 'ci-probe.txt' 2>/dev/null")
          if [ -n "$probe" ]; then
            echo "构建上下文没排除下载目录，探针进了镜像："
            printf '%s\n' "$probe"
            exit 1
          fi
          leftovers=$(docker run --rm --entrypoint sh "$image" -c \
            'if [ -d /app/downloads ]; then ls -A /app/downloads; fi')
          if [ -n "$leftovers" ]; then
            echo "镜像里的 /app/downloads 有内容："
            printf '%s\n' "$leftovers"
            exit 1
          fi
          echo "镜像里没有下载残留（探针也没进去）"

      - name: 镜像启动冒烟
        # 只构建不冒烟，等于「镜像是怎么来的」仍然只有半句证据。
        # 这里把两个镜像真起一次、打一次 /api/health、再收摊。
        run: |
          set -euo pipefail
          # bind mount 的宿主目录默认以 root 属主创建，容器里的非 root 用户
          # （uid 10001）写不进去 —— 先放开权限，否则冒烟会停在「起不来」这一步。
          mkdir -p backend/data backend/logs
          chmod 777 backend/data backend/logs
          # 后端在 JWT_SECRET 缺失时拒绝启动；这里给一个一次性占位值，
          # 只存在于这台 CI 机器上，不入库、不复用。
          printf 'JWT_SECRET=ci-smoke-placeholder-not-a-real-secret\n' > backend/.env
          docker compose up -d
          ok=0
          # 45 × 2s = 90 秒：后端健康检查 start_period 20s + interval 30s，
          # nginx 要等后端 healthy 才起 —— 轮询窗口给足，别让冒烟红在「等太久」。
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "后端在 90 秒内没健康，冒烟失败。下面是容器日志："
            docker compose logs
            exit 1
          fi
          curl -fsS -o /dev/null -w 'health=%{http_code}\n' http://127.0.0.1:8080/api/health
          docker compose down

  # 变异验证：把每一种要抓的形态故意放回去，确认关卡会转红。
  # 每个脚本一个 job：互相独立、并行跑、互不污染（脚本自己按字节还原）。
  mutation-backend:
    name: 变异验证 · ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        script:
          - scripts/mutation_auth_boundary.py
          - scripts/mutation_clean_url.py
          - scripts/mutation_db_fixture_gate.py
          - scripts/mutation_download_paths.py
          - scripts/mutation_payment_webhook.py
          - scripts/mutation_platform_routing.py
          - scripts/mutation_refs_gate.py
          - scripts/mutation_secrets_gate.py
          - scripts/mutation_summarizer_pure.py
          - scripts/mutation_url_canonical.py
          - backend/tests/mutation_check.py
          - backend/tests/mutation_check_quota.py
          - backend/tests/mutation_prompt.py
          - backend/tests/mutation_backup_naming.py
          - backend/tests/mutation_legacy_users.py
          - backend/tests/mutation_ratelimit.py
          - backend/tests/mutation_concurrency_limit.py
          - backend/tests/mutation_download_artifacts.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装环境
        run: bash scripts/bootstrap.sh

      - name: 跑变异脚本
        run: backend/venv/bin/python ${{ matrix.script }}

  mutation-frontend:
    name: 变异验证 · ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        script:
          - tests/mutation-nav-wall.mjs
          - tests/mutation-ui-fixes.mjs
          - tests/mutation_wiring.mjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装前端依赖
        run: cd frontend && npm ci

      - name: 跑变异脚本
        run: cd frontend && node ${{ matrix.script }}
