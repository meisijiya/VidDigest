# 依赖更新：每天看一眼，但同一批只开一个 PR，免得噪声盖过信号。
version: 2

updates:
  # 后端：requirements.txt / requirements-dev.txt 只有下界、没有锁文件，
  # 所以这里盯的是「有没有新的上界约束出现」，真正的可复现性要靠钉版解决。
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      backend-deps:
        patterns:
          - "*"

  # 前端：package-lock.json 已跟踪，npm 这一路是可复现的。
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    ignore:
      # 大版本一律不放行：自动合并只该做「补丁 + 次版本」这种改行为概率低的事。
      # 这三个都是会改运行时行为的大版本，人工评估过再放进来：
      #  - typescript >=6：只在本地跑过 vue-tsc --noEmit（exit 0），
      #    没在「类型检查 + 测试 + 构建 + 镜像冒烟」整条链路上验过；
      #    typescript-eslint 8.x 的 peer 上限也是 <6.1.0。
      #  - vue-router 5：ADR 0018 记的是 vue-router 4 的用法，
      #    大版本换的是路由运行时的行为，值得单独读一次 changelog。
      #  - @vueuse/core 15：同为大版本，与本仓实际用到的几个组合函数无关，
      #    但换版本不该由机器人顺手决定。
      # 早期只挡 typescript >=6.1.0，结果 #82 仍把 typescript 提到 6.0.3
      # 并连带 vue-router 5 / @vueuse/core 15（实测：门禁第 6 关报
      # TS5101 baseUrl 已废弃，TypeScript 7 起该选项失效）。
      - dependency-name: "typescript"
        versions:
          - ">=6.0.0"
      - dependency-name: "vue-router"
        versions:
          - ">=5.0.0"
      - dependency-name: "@vueuse/core"
        versions:
          - ">=15.0.0"
    groups:
      frontend-deps:
        patterns:
          - "*"

  # CI 本身：Actions 版本升级容易悄悄改行为，单独看。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
